name: Build WordMaster APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/wordmaster-23", "feature/wordmaster-24-profile-design-vocabulary", "feature/wordmaster-25-smart-learning" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Expand dictionary to 100,000 unique English entries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://raw.githubusercontent.com/firatkaya1/dictionary/main/dictionary-json.zip" -o /tmp/dictionary-json.zip
          python3 - <<'PY'
          import json, zipfile, pathlib, re
          archive = zipfile.ZipFile('/tmp/dictionary-json.zip')
          candidates = [n for n in archive.namelist() if n.lower().endswith('.json')]
          if not candidates:
              raise SystemExit("Dictionary archive contains no JSON file")
          source_name = max(candidates, key=lambda n: archive.getinfo(n).file_size)
          with archive.open(source_name) as f:
              source = json.load(f)
          if not isinstance(source, list) or not source:
              raise SystemExit("Unexpected source dictionary format")
          target = pathlib.Path("app/src/main/assets/dictionary.json")
          existing = json.loads(target.read_text(encoding="utf-8"))
          merged = []
          seen = set()
          def add(en, tr, level="A2", example=None):
              if not isinstance(en, str) or not isinstance(tr, str):
                  return
              en, tr = en.strip(), tr.strip()
              key = en.casefold()
              if not en or not tr or key in seen or len(en) > 100:
                  return
              if not re.search(r"[A-Za-z]", en):
                  return
              seen.add(key)
              item = {"en": en, "tr": tr, "level": level}
              if example:
                  item["example"] = example
              merged.append(item)
          for item in existing:
              add(item.get("en"), item.get("tr"), item.get("level", "A1"), item.get("example"))
          # Prefer common-usage entries, then general entries; combine repeated
          # source rows into one English headword with multiple Turkish meanings.
          grouped = {}
          for item in source:
              if not isinstance(item, dict):
                  continue
              en = item.get("word") or item.get("word_en") or item.get("en")
              tr = item.get("tr") or item.get("word_tr")
              category = str(item.get("category", ""))
              if not isinstance(en, str) or not isinstance(tr, str):
                  continue
              key = en.strip().casefold()
              if not key or not tr.strip():
                  continue
              priority = 0 if "common usage" in category.casefold() else 1
              grouped.setdefault(key, {"en": en.strip(), "meanings": [], "priority": priority})
              entry = grouped[key]
              entry["priority"] = min(entry["priority"], priority)
              meaning = tr.strip()
              if meaning not in entry["meanings"]:
                  entry["meanings"].append(meaning)
          for entry in sorted(grouped.values(), key=lambda x: (x["priority"], x["en"].casefold())):
              if len(merged) >= 100000:
                  break
              add(entry["en"], " / ".join(entry["meanings"][:8]))
          if len(merged) < 100000:
              raise SystemExit(f"Only {len(merged)} unique entries found; refusing to create a smaller dictionary")
          target.write_text(json.dumps(merged[:100000], ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Generated {len(merged[:100000])} unique English entries from {source_name}")
          PY
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordMaster-100000-dictionary-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
