name: Build WordMaster APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop", "feature/wordmaster-23", "feature/wordmaster-24-profile-design-vocabulary", "feature/wordmaster-25-smart-learning" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Import full English-Turkish dictionary in one pass
        run: |
          mkdir -p build
          curl --fail --location --retry 3 --output build/en-tr.zip https://github.com/DanielGregorini/koreader-dicts/releases/download/v1.2.0/en-tr.zip
          python3 scripts/import_en_tr_dictionary.py build/en-tr.zip
      - name: Validate bundled dictionary without rewriting translations
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('app/src/main/assets/dictionary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(data, list) and data, 'Bundled dictionary is empty or invalid'
          assert all(isinstance(x.get('en'), str) and isinstance(x.get('tr'), str) and x['en'].strip() and x['tr'].strip() for x in data), 'Invalid dictionary entry'
          print(f'Validated {len(data)} bundled dictionary entries; original translations preserved')
          PY
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run learning engine unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordMaster-100000-dictionary-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
